# Publishes a version: pushing a tag vX.Y (or running this workflow by hand with the version) tests the simulation,
# builds the Linux and Windows archives with scripts/package_release.sh and puts them in the GitHub release vX.Y.
# The assets keep the same names from one version to the next, so the README's links always give the latest one.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 9.2 (the tag vX.Y is created on the chosen branch)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          v="${{ github.event.inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          grep -q "\"v$v\"" src/game/screen_title.cpp || { echo "the title screen does not show v$v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev \
            mingw-w64

      - name: Tests
        run: |
          cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release -DCLASH_BUILD_GAME=OFF
          cmake --build build-core -j"$(nproc)"
          ./build-core/sim_test

      - name: Archives
        run: scripts/package_release.sh "${{ steps.v.outputs.version }}"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          cp "dist/SuperClashBros-$v-linux-x64.tar.gz" dist/SuperClashBros-linux-x64.tar.gz
          cp "dist/SuperClashBros-$v-windows-x64.zip" dist/SuperClashBros-windows-x64.zip
          files="dist/SuperClashBros-linux-x64.tar.gz dist/SuperClashBros-windows-x64.zip"
          if gh release view "v$v" > /dev/null 2>&1; then
            gh release upload "v$v" $files --clobber
          else
            gh release create "v$v" $files --target "$GITHUB_SHA" --title "Super Clash Bros. v$v" \
              --notes-file packaging/NOUVEAUTES.md
          fi
